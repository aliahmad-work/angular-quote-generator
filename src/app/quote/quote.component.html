<div class="quote-card" appHoverHighlight>
  <p class="quote-preview">Qoute Preview: {{ current().text | quotePreview }}</p>
  <p class="quote-text">{{ current().text }}</p>
  <p class="reverse-text">{{ current().text | reverseText }}</p>
  <p class="word-count">Word Count: {{ current().text | wordCount }}</p>
  <p class="quote-author">{{ current().author }} - {{ current().author | authorInitials }}</p>
  <button (click)="nextQuote()">Next Quote</button>
</div>
